spring.profiles.active=dev
spring.application.name=spring-boot-library
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.console.enabled=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.data.rest.base-path=/api

spring.main.allow-bean-definition-overriding=true

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
stripe.key.secret=${STRIPE_KEY_SECRET:}

app.jwt.secret=${APP_JWT_SECRET:dGVtby1qd3Qtc2VjcmV0LXRoaXMtZm9yLWRldmVsb3BtZW50LW9ubHk}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
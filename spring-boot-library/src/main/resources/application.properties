spring.profiles.active=dev
spring.application.name=spring-boot-library
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.console.enabled=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.data.rest.base-path=/api

app.allowed.origins=${APP_ALLOWED_ORIGINS:}
server.forward-headers-strategy=native

spring.main.allow-bean-definition-overriding=true

google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
stripe.key.secret=${STRIPE_KEY_SECRET:}

app.jwt.secret=${APP_JWT_SECRET:dGVtby1qd3Qtc2VjcmV0LXRoaXMtZm9yLWRldmVsb3BtZW50LW9ubHk}

# Access JWT: 15 minutes (override with APP_JWT_EXPIRATION_MS, e.g. 60000 to test expiry quickly)
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}

# Refresh token: 7 days
app.refresh-token.expiration-ms=${APP_REFRESH_EXPIRATION_MS:604800000}
# Window in which re-using a just-rotated token is treated as a multi-tab race, not an attack
app.refresh-token.reuse-grace-ms=10000

# Local development over HTTP
app.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.refresh-token.cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
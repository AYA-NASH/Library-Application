databaseChangeLog:
  - changeSet:
      id: 003-add-messages-timestamps
      author: ayana

      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
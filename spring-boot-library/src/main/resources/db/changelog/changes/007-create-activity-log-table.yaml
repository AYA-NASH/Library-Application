databaseChangeLog:
  - changeSet:
      id: 007-create-activity-log-table
      author: ayana
      changes:
        - createTable:
            tableName: activity_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: action_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: actor
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false